# Core Task 1: infrastructure services only (Postgres 18, Redis 8, SeaweedFS S3).
# Application services (migrate, api, worker, web) are added in Core Task 13.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  backend:
    internal: true
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress:
    driver: bridge

volumes:
  pg-data:
  s3-data:

services:
  postgres:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lomi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-dev-migrator}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dev-app}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-lomi}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  redis:
    image: redis:8@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-dev-redis}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-dev-redis}
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  s3:
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    restart: unless-stopped
    command:
      - server
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
