# Full local evaluation stack (spec §10.5, Core Task 13).
# Runs cleanly with `docker compose up --build` and zero .env file required.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

networks:
  backend:
    internal: true
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress:
    driver: bridge

volumes:
  pg-data:
  s3-data:

services:
  postgres:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lomi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-dev-migrator}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dev-app}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-lomi}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  redis:
    image: redis:8@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-dev-redis}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-dev-redis}
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  s3:
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    restart: unless-stopped
    command:
      - server
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  migrate:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    command: ['node', 'node_modules/@app/db/dist/cli/migrate-and-seed.js']
    pids_limit: 64
    mem_limit: 512m
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_MIGRATOR_URL: postgresql://migrator:${POSTGRES_MIGRATOR_PASSWORD:-dev-migrator}@postgres:5432/${POSTGRES_DB:-lomi}
      S3_ENDPOINT: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-s3-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-s3-secret}
      FIXTURES_DIR: /app/fixtures
    volumes:
      - ./fixtures:/app/fixtures:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    pids_limit: 128
    mem_limit: 512m
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://app:${POSTGRES_APP_PASSWORD:-dev-app}@postgres:5432/${POSTGRES_DB:-lomi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-s3-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-s3-secret}
      API_PORT: '3000'
      TRUST_PROXY_CIDR: ${TRUST_PROXY_CIDR:-172.30.0.0/24}
      DEBUG_ENDPOINTS: ${DEBUG_ENDPOINTS:-false}
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 2g
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://app:${POSTGRES_APP_PASSWORD:-dev-app}@postgres:5432/${POSTGRES_DB:-lomi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis}@redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-s3-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-s3-secret}
      WORKER_HTTP_PORT: '3001'
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - backend
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /var/cache/nginx:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 64
    mem_limit: 128m
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/index.html']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
