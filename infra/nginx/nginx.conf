# Hardened unprivileged nginx configuration for read-only rootfs (spec §8, §10.4, §10.5).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Temp paths on tmpfs so read-only rootfs survives 11 MB PDF uploads (spec §10.5).
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Rate and connection limiting (spec §8 & §10.4).
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  access_log /dev/stdout;

  upstream api_upstream {
    server api:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 11m;
    limit_conn addr_conn 32;

    # SPA CSP and security headers (spec §8).
    add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Streaming PDF downloads without buffering (spec §10.4).
    location ~ ^/api/documents/[^/]+/versions/[0-9]+/file$ {
      limit_req zone=api_general burst=20 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;
    }

    # Upload endpoints with tighter request rate limit.
    location ~ ^/api/documents(/[^/]+/versions)?$ {
      limit_req zone=api_upload burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;
    }

    # General API reverse proxy; preserves ETag and If-None-Match unchanged.
    location /api/ {
      limit_req zone=api_general burst=40 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;
    }

    # Long-cache hashed Vite assets.
    location /assets/ {
      add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # No-cache on index.html and SPA fallback.
    location = /index.html {
      add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
